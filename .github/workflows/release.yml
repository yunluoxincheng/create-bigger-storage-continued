name: Build and release
run-name: Build ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['mc*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing mc<Minecraft>-v<mod> tag to publish; leave empty for a build only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || '' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      minecraft: ${{ steps.metadata.outputs.minecraft }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_type: ${{ steps.metadata.outputs.release_type }}
      release_name: ${{ steps.metadata.outputs.release_name }}
    steps:
      - name: Validate selected tag format
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          pattern = r'mc[0-9]+\.[0-9]+(?:\.[0-9]+)?-v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9]+(?:[.-][A-Za-z0-9]+)*)?'
          if tag and not re.fullmatch(pattern, tag):
              raise SystemExit('Use mc<Minecraft>-v<mod>, for example mc1.20.1-v1.1.3')
          PY

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper and cache dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate version and changelog
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
          BUILD_BRANCH: ${{ !inputs.tag && startsWith(github.ref, 'refs/heads/') && github.ref_name || '' }}
        run: python3 tools/PrepareRelease.py check --tag "$RELEASE_TAG" --branch "$BUILD_BRANCH"

      - name: Build reobfuscated mod and sources
        run: bash ./gradlew --no-daemon --stacktrace jarJar sourcesJar

      - name: Verify and prepare release files
        run: python3 tools/PrepareRelease.py package

      - name: Upload verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.metadata.outputs.minecraft }}-${{ steps.metadata.outputs.version }}
          path: build/github-release/${{ steps.metadata.outputs.minecraft }}/${{ steps.metadata.outputs.version }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: (startsWith(github.ref, 'refs/tags/') && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.build.outputs.minecraft }}-${{ needs.build.outputs.version }}
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          RELEASE_TYPE: ${{ needs.build.outputs.release_type }}
          MINECRAFT_VERSION: ${{ needs.build.outputs.minecraft }}
          LATEST_MINECRAFT_BRANCH: ${{ vars.LATEST_MINECRAFT_BRANCH }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease_args=()
          if [[ "$RELEASE_TYPE" != "release" ]]; then
            prerelease_args+=(--prerelease --latest=false)
          elif [[ "$MINECRAFT_VERSION" == "$LATEST_MINECRAFT_BRANCH" ]]; then
            prerelease_args+=(--latest)
          else
            prerelease_args+=(--latest=false)
          fi
          # Re-running a published tag must not replace its existing artifacts.
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_NAME" \
            --notes-file release-files/CHANGELOG.md \
            "${prerelease_args[@]}" \
            release-files/*.jar \
            release-files/SHA256SUMS.txt \
            release-files/verification.json
